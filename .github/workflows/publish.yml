name: Publish

on:
  workflow_call:
    inputs:
      version:
        description: Release version to publish (x.y.z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish (x.y.z)
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/runningman84/gh-token
  CHART_REPO: oci://ghcr.io/runningman84/charts/gh-token

jobs:
  binaries:
    name: Binaries (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rustflags: "-C target-feature=+crt-static"
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rustflags: "-C target-feature=+crt-static"
          # darwin-amd64 (macos-14) and windows (x86_64-pc-windows-msvc) are
          # intentionally excluded for now: Intel-mac runners are flaky and the
          # Windows build fails on reqwest's rustls -> aws-lc-sys C dependency.
          - os: darwin
            arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            rustflags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (static musl, linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Package
        shell: bash
        run: |
          SRC="target/${{ matrix.target }}/release"
          ARCHIVE="gh-token-${{ inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          mkdir -p dist
          cp "$SRC/gh-token-server" "$SRC/gh-token" dist/
          # Archive inside dist/ so the artifact (dist/*) contains the tarball.
          (cd dist && tar czf "$ARCHIVE" gh-token-server gh-token)
          # Keep only the archive in the artifact.
          find dist -maxdepth 1 -type f ! -name "$ARCHIVE" -delete
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ inputs.version }}" dist/* --clobber

  image:
    name: Image (linux/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: binaries
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-linux-${{ matrix.arch }}
          path: image-ctx

      - name: Prepare build context
        run: |
          tar xzf "image-ctx/gh-token-${{ inputs.version }}-linux-${{ matrix.arch }}.tar.gz" -C image-ctx/
          # reqwest uses the platform certificate store, so bundle the CA
          # certificates. The runner's Mozilla CA bundle is equivalent to the
          # one the image would otherwise ship.
          cp /etc/ssl/certs/ca-certificates.crt image-ctx/ca-certificates.crt
          ls -la image-ctx/

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker buildx build --push \
            --platform "linux/${{ matrix.arch }}" \
            -f Dockerfile.image \
            -t "${IMAGE_NAME}:v${{ inputs.version }}-${{ matrix.arch }}" \
            -t "${IMAGE_NAME}:${{ inputs.version }}-${{ matrix.arch }}" \
            image-ctx

  image-manifest:
    name: Image manifest + SBOM + scan
    runs-on: ubuntu-24.04
    needs: [binaries, image]
    steps:
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create multi-arch manifests
        run: |
          VERSION="${{ inputs.version }}"
          V="v${VERSION}"
          MAJOR="${VERSION%%.*}"
          MINOR="$(echo "$VERSION" | cut -d. -f1,2)"
          for TAG in "$V" "$MINOR" "$MAJOR" "latest"; do
            docker manifest create "${IMAGE_NAME}:${TAG}" \
              "${IMAGE_NAME}:${V}-amd64" "${IMAGE_NAME}:${V}-arm64"
            docker manifest annotate "${IMAGE_NAME}:${TAG}" "${IMAGE_NAME}:${V}-amd64" --arch amd64 --os linux
            docker manifest annotate "${IMAGE_NAME}:${TAG}" "${IMAGE_NAME}:${V}-arm64" --arch arm64 --os linux
            docker manifest push "${IMAGE_NAME}:${TAG}"
            echo "pushed manifest ${IMAGE_NAME}:${TAG}"
          done

      - name: Generate SBOMs (Syft)
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p assets
          for ARCH in amd64 arm64; do
            IMG="${IMAGE_NAME}:v${VERSION}-${ARCH}"
            docker pull "$IMG"
            docker run --rm \
              -v "$PWD/assets:/out" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              ghcr.io/anchore/syft:latest \
              syft image "$IMG" \
              -o "spdx-json=/out/sbom-v${VERSION}-${ARCH}.spdx.json" \
              -o "cyclonedx-json=/out/sbom-v${VERSION}-${ARCH}.cdx.json"
          done
          ls -la assets/

      - name: Vulnerability scan (Grype)
        run: |
          VERSION="${{ inputs.version }}"
          for ARCH in amd64 arm64; do
            IMG="${IMAGE_NAME}:v${VERSION}-${ARCH}"
            docker run --rm \
              -v "$PWD/assets:/out" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              ghcr.io/anchore/grype:latest \
              grype image "$IMG" -o table \
              > "assets/grype-v${VERSION}-${ARCH}.txt" || true
            docker run --rm \
              -v "$PWD/assets:/out" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              ghcr.io/anchore/grype:latest \
              grype image "$IMG" -o json \
              > "assets/grype-v${VERSION}-${ARCH}.json" || true
            docker run --rm \
              -v "$PWD/assets:/out" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              ghcr.io/anchore/grype:latest \
              grype image "$IMG" -o sarif \
              > "assets/grype-v${VERSION}-${ARCH}.sarif" || true
          done
          ls -la assets/

      - name: Upload scan assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ inputs.version }}" assets/* --clobber

  chart:
    name: Helm chart (OCI)
    runs-on: ubuntu-24.04
    needs: binaries
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Lint
        run: |
          # The chart schema requires a non-empty app key when secret.create
          # is true (the default), so lint with sample values.
          cat > /tmp/values.yaml <<'EOF'
          secret:
            data:
              GH_APP_ID: "1234567"
              GH_APP_INSTALLATION_ID: "7654321"
              GH_APP_KEY_B64: "dGVzdA=="
          EOF
          helm lint chart -f /tmp/values.yaml

      - name: Package and push to OCI registry
        env:
          HELM_REPOSITORY_USERNAME: ${{ github.actor }}
          HELM_REPOSITORY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          helm package chart -d dist/
          helm push "dist/gh-token-${{ inputs.version }}.tgz" "${CHART_REPO}"

      - name: Upload chart to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ inputs.version }}" "dist/gh-token-${{ inputs.version }}.tgz" --clobber
