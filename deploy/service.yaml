apiVersion: v1
kind: Service
metadata:
  name: gh-token
  namespace: gh-token
  labels:
    app.kubernetes.io/name: gh-token
    app.kubernetes.io/instance: gh-token
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gh-token
    app.kubernetes.io/instance: gh-token
  ports:
    - name: http
      port: 8080
      targetPort: http
