# Credentials for the gh-token server.
#
# Generate a GitHub App RSA key and base64-encode it:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out app.key.pem
#   base64 -w0 app.key.pem
#
# Encrypt this file with sops (only the secret material is encrypted):
#   sops --encrypt --encrypted-regex 'stringData' deploy/secret.example.yaml \
#     > deploy/secret.yaml
#
# Then apply:
#   kubectl apply -f deploy/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: gh-token-credentials
  namespace: gh-token
type: Opaque
stringData:
  GH_APP_ID: "1234567"
  GH_APP_INSTALLATION_ID: "7654321"
  GH_APP_KEY_B64: "LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCmV4YW1wbGUKLS0tLS1FTkQgUFJJVkFURSBLRVktLS0tLQo="
  # Optional: shared API key clients must present (GHTS_API_KEY).
  # Uncomment to enable:
  # GHTS_API_KEY: "change-me"
