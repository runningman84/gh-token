{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gh-token.fullname" . }}
  labels:
    {{- include "gh-token.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gh-token.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Kubelet liveness/readiness probes originate from the node host.
    # Allow from pods with hostNetwork=true (node-exporter, kubelet, etc.)
    - from:
        - podSelector:
            matchLabels:
              kubernetes.io/hostname: ""
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- with .Values.networkPolicy.ingressFrom }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Cluster DNS (required for resolving api.github.com)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # GitHub API
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    {{- with .Values.networkPolicy.egressTo }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}