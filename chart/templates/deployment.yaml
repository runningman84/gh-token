{{- if .Values.clientAuth.enabled }}
{{- if not .Values.clientAuth.clients }}
{{- fail "clientAuth.enabled requires at least one client" }}
{{- end }}
{{- if not .Values.clientAuth.requireKnownClient }}
{{- fail "clientAuth.enabled requires clientAuth.requireKnownClient=true" }}
{{- end }}
{{- range $key := list "GHTS_API_KEY" "GHTS_CLIENT_KEYS" "GHTS_CLIENT_KEYS_DIR" "GHTS_REQUIRE_KNOWN_CLIENT" }}
{{- if or (hasKey $.Values.env $key) (hasKey $.Values.secret.data $key) }}
{{- fail (printf "clientAuth manages authentication; remove %s from env/secret.data" $key) }}
{{- end }}
{{- end }}
{{- if .Values.secret.apiKey }}
{{- fail "clientAuth cannot be combined with secret.apiKey" }}
{{- end }}
{{- $names := dict }}
{{- range .Values.clientAuth.clients }}
{{- if hasKey $names .name }}
{{- fail (printf "duplicate clientAuth client name: %s" .name) }}
{{- end }}
{{- $_ := set $names .name true }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gh-token.fullname" . }}
  labels:
    {{- include "gh-token.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gh-token.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gh-token.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "gh-token.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gh-token
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if .Values.clientAuth.enabled }}
          volumeMounts:
            - name: client-keys
              mountPath: /etc/gh-token/client-keys
              readOnly: true
          {{- end }}
          env:
            {{- if .Values.clientAuth.enabled }}
            - name: GHTS_CLIENT_KEYS_DIR
              value: /etc/gh-token/client-keys
            - name: GHTS_REQUIRE_KNOWN_CLIENT
              value: {{ .Values.clientAuth.requireKnownClient | quote }}
            {{- end }}
            {{- range $key, $value := .Values.secret.data }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "gh-token.secretName" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- if .Values.secret.apiKey }}
            - name: GHTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gh-token.secretName" . }}
                  key: GHTS_API_KEY
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
      {{- if .Values.clientAuth.enabled }}
      volumes:
        - name: client-keys
          projected:
            defaultMode: 0444
            sources:
              {{- range .Values.clientAuth.clients }}
              - secret:
                  name: {{ .secretRef.name | quote }}
                  optional: false
                  items:
                    - key: {{ .secretRef.key | quote }}
                      path: {{ .name | quote }}
              {{- end }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
