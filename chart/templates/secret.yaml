{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gh-token.secretName" . }}
  labels:
    {{- include "gh-token.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- if .Values.secret.apiKey }}
  GHTS_API_KEY: {{ .Values.secret.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
