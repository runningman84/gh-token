# Default values for gh-token.
#
# The GitHub App credentials are read from a secret (created by this chart
# or provided by you). The secret keys must be GH_APP_ID,
# GH_APP_INSTALLATION_ID and GH_APP_KEY_B64 (base64-encoded PEM RSA key).

replicaCount: 1

image:
  repository: ghcr.io/runningman84/gh-token
  tag: "1.1.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Create a dedicated ServiceAccount (no token mounted).
  create: true
  # Name of the ServiceAccount to use; defaults to <fullname>.
  name: ""
  annotations: {}

# Credentials secret.
secret:
  # Render the Secret resource from the data below. Set to false and point
  # `name` at an existing secret when you manage it yourself (e.g. via sops
  # + external-secrets).
  create: true
  name: ""
  annotations: {}
  data:
    GH_APP_ID: "0"
    GH_APP_INSTALLATION_ID: "0"
    # REPLACE THIS with your base64-encoded GitHub App PEM key.
    # Generate with: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out key.pem && base64 -w0 key.pem
    GH_APP_KEY_B64: "REPLACE_WITH_BASE64_ENCODED_PEM_KEY"
  # Optional shared API key. When set, clients must send it as
  # `X-GH-Token-Key` (or `Authorization: Bearer <key>`).
  apiKey: ""

service:
  type: ClusterIP
  port: 8080

probes:
  # Gates liveness/readiness: the pod is considered started only once the
  # startup credential check and a reachability probe both succeeded.
  # 20 x 5s = up to 100s, which also covers a first startup-check failure
  # (background retry fires at ~30s).
  startup:
    path: /ready
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 20
  liveness:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 6

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Existing per-agent Secrets in the gh-token namespace. No passwords in values.
# Keys are loaded at startup: roll out server and agents after Secret rotation.
clientAuth:
  enabled: false
  requireKnownClient: true
  clients: []
  # - name: agent-a
  #   secretRef:
  #     name: agent-a-auth
  #     key: api-key

podAnnotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Extra configuration, passed through as environment variables.
# See the server documentation for all GHTS_* options.
# For per-client keys, prefer clientAuth with existing Secret references above.
# Literal credentials in env or secret.data are stored in Helm release metadata.
# To make the token purpose part of the cache key (differing purpose =>
# fresh token), set env.GHTS_PURPOSE_KEY: "true" (advisory-only by default).
env:
  GHTS_BIND: "0.0.0.0:8080"
  GHTS_TOKEN_TTL: "3600"
  GHTS_MIN_TTL: "60"
  GHTS_RENEW_BEFORE: "300"
  GHTS_ACTIVITY_WINDOW: "900"
  GHTS_WATCH_INTERVAL: "30"
  GHTS_PROBE_INTERVAL: "30"
  GHTS_READY_MAX_AGE: "90"
  GHTS_RATE_MAX: "30"
  GHTS_RATE_WINDOW: "60"
  GHTS_BACKOFF_BASE_SECS: "2"
  GHTS_BACKOFF_MAX_SECS: "300"
  GHTS_LOG: "info"
  GHTS_LOG_JSON: "true"

# Prometheus ServiceMonitor (requires the prometheus-operator CRDs).
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Cilium NetworkPolicy: restricts who can call the server and where it can
# reach out to.
cilium:
  enabled: false
  # Client pods that may call the token endpoint.
  # Client pods that may call the token endpoint. Specify your own clients;
  # this policy allows no client pods by default.
  clients: []
  # Example:
  # - namespace: my-agent
  #   labels:
  #     app.kubernetes.io/name: my-agent
  egressGitHubFqdn: api.github.com
