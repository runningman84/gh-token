# Default values for gh-token.
#
# The GitHub App credentials are read from a secret (created by this chart
# or provided by you). The secret keys must be GH_APP_ID,
# GH_APP_INSTALLATION_ID and GH_APP_KEY_B64 (base64-encoded PEM RSA key).

replicaCount: 1

image:
  repository: ghcr.io/runningman84/gh-token
  tag: "2.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Create a dedicated ServiceAccount (no token mounted).
  create: true
  # Name of the ServiceAccount to use; defaults to <fullname>.
  name: ""
  annotations: {}

# Credentials secret.
secret:
  # Render the Secret resource from the data below. Set to false and point
  # `name` at an existing secret when you manage it yourself (e.g. via sops
  # + external-secrets).
  create: true
  name: ""
  annotations: {}
  data:
    GH_APP_ID: "0"
    GH_APP_INSTALLATION_ID: "0"
    # REPLACE THIS with your base64-encoded GitHub App PEM key.
    # Generate with: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out key.pem && base64 -w0 key.pem
    GH_APP_KEY_B64: "REPLACE_WITH_BASE64_ENCODED_PEM_KEY"
  # Optional shared API key. When set, clients must send it as
  # `X-GH-Token-Key` (or `Authorization: Bearer <key>`).
  apiKey: ""

service:
  type: ClusterIP
  port: 8080

probes:
  # Gates liveness/readiness: the pod is considered started only once the
  # startup credential check and a reachability probe both succeeded.
  # 20 x 5s = up to 100s, which also covers a first startup-check failure
  # (background retry fires at ~30s).
  startup:
    path: /ready
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 20
  liveness:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 6

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Extra configuration, passed through as environment variables.
# See the server documentation for all GHTS_* options.
# For per-client keys, prefer secret.data (keeps the keys out of the release
# manifest); e.g. add GHTS_CLIENT_KEYS='{"hermes":"…"}' to the secret, or set
# env.GHTS_CLIENT_KEYS below.
# To make the token purpose part of the cache key (differing purpose =>
# fresh token), set env.GHTS_PURPOSE_KEY: "true" (advisory-only by default).
env:
  GHTS_BIND: "0.0.0.0:8080"
  GHTS_TOKEN_TTL: "3600"
  GHTS_MIN_TTL: "60"
  GHTS_RENEW_BEFORE: "300"
  GHTS_ACTIVITY_WINDOW: "900"
  GHTS_WATCH_INTERVAL: "30"
  GHTS_PROBE_INTERVAL: "30"
  GHTS_READY_MAX_AGE: "90"
  GHTS_RATE_MAX: "30"
  GHTS_RATE_WINDOW: "60"
  GHTS_BACKOFF_BASE_SECS: "2"
  GHTS_BACKOFF_MAX_SECS: "300"
  GHTS_LOG: "info"
  GHTS_LOG_JSON: "true"

# Prometheus ServiceMonitor (requires the prometheus-operator CRDs).
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Prometheus alerting rules for the gh-token server (requires the
# prometheus-operator CRDs). The rules are rendered into a PrometheusRule
# in the group `gh_token.rules`; edit or replace `rules` to customize them.
# Prometheus template placeholders ({{ $labels.app_id }}, {{ $labels.install_id }})
# are available in the annotations.
prometheusRules:
  enabled: false
  labels: {}
  rules:
    - alert: GHTokenGitHubUnreachable
      # The readiness probe to the GitHub API keeps failing (it is also set
      # to 0 while the rate-limit backoff suppresses the probe).
      expr: min by (app_id, install_id) (ghts_github_reachable) == 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "gh-token cannot reach the GitHub API (app {{ $labels.app_id }}, installation {{ $labels.install_id }})"
        description: >-
          The readiness probe to the GitHub API has been failing for more
          than 2 minutes. While the rate-limit backoff cooldown is active the
          server suppresses GitHub calls, so token issuance is degraded or
          blocked (HTTP 503) until GitHub is reachable again.
    - alert: GHTokenStartupCheckFailing
      # Startup credential validation failing; background retries (30s..300s)
      # have not recovered for 10 minutes.
      expr: min by (app_id, install_id) (ghts_startup_check_ok) == 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "gh-token startup credential validation failing (app {{ $labels.app_id }}, installation {{ $labels.install_id }})"
        description: >-
          The startup credential check has been failing for more than 10
          minutes. Check the GitHub App credentials (GH_APP_ID,
          GH_APP_INSTALLATION_ID, GH_APP_KEY_B64), the app installation, and
          network connectivity to the GitHub API.
    - alert: GHTokenGitHubRateLimitBackoff
      # Sustained GitHub rate limiting: the backoff cooldown stays above
      # 60s (a single rate-limit event decays below the `for` window).
      expr: max by (app_id, install_id) (ghts_github_cooldown_seconds) > 60
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "gh-token is in a sustained GitHub rate-limit backoff (app {{ $labels.app_id }}, installation {{ $labels.install_id }})"
        description: >-
          The GitHub rate-limit cooldown has stayed above 60 seconds for more
          than 5 minutes. GitHub is returning 429/403 rate-limit responses
          repeatedly and the server is suppressing GitHub calls. Review the
          token request volume, the probe interval, and the remaining rate
          limit (ghts_github_rate_limit_remaining).
    - alert: GHTokenGitHubApiErrors
      # Repeated genuine GitHub API failures (transport errors, unexpected
      # HTTP responses); rate-limited responses are not counted here.
      expr: sum by (app_id, install_id) (increase(ghts_github_api_errors_total[10m])) > 5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "gh-token is seeing repeated GitHub API failures (app {{ $labels.app_id }}, installation {{ $labels.install_id }})"
        description: >-
          More than 5 GitHub API failures were recorded in the last 10
          minutes. Check the server logs and the operation label to identify
          the failing endpoint.
    - alert: GHTokenTokenEndpointErrors
      # User-facing 5xx on the token endpoint (typically 503 during the
      # GitHub backoff cooldown).
      expr: sum by (app_id, install_id) (rate(ghts_token_requests_total{status=~"5[0-9][0-9]"}[5m])) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "gh-token token endpoint is returning 5xx errors (app {{ $labels.app_id }}, installation {{ $labels.install_id }})"
        description: >-
          The /token endpoint has been returning 5xx responses for more than
          5 minutes. Clients cannot obtain installation tokens.
    - alert: GHTokenTokenRequestsSlow
      # p99 token request latency above 5 seconds (slow GitHub API or
      # client retry storms).
      expr: histogram_quantile(0.99, sum by (le, app_id, install_id) (rate(ghts_token_request_duration_seconds_bucket[5m]))) > 5
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "gh-token token request latency is high (app {{ $labels.app_id }}, installation {{ $labels.install_id }})"
        description: >-
          The p99 latency of /token requests has exceeded 5 seconds for more
          than 10 minutes. This usually indicates slow GitHub API responses
          or clients retrying while GitHub is rate limited.
    - alert: GHTokenClientsThrottled
      # The per-client rate limiter is rejecting requests (a client polls
      # faster than GHTS_RATE_MAX per GHTS_RATE_WINDOW).
      expr: sum by (app_id, install_id) (increase(ghts_rate_limit_rejections_total[10m])) > 10
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "gh-token is throttling client token requests (app {{ $labels.app_id }}, installation {{ $labels.install_id }})"
        description: >-
          More than 10 token requests were rejected by the per-client rate
          limiter in the last 10 minutes. A client is requesting tokens more
          often than expected; check its polling interval or raise the limit.

# Cilium NetworkPolicy: restricts who can call the server and where it can
# reach out to.
cilium:
  enabled: false
  # Example client pods that may call the token endpoint:
  # clients:
  #   - namespace: hermes
  #     labels:
  #       app.kubernetes.io/name: hermes
